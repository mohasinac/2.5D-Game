# Dev + test environment.
#
#   docker compose up app              → Vite dev server on http://localhost:3000
#   docker compose run --rm typecheck  → tsc --noEmit
#   docker compose run --rm test       → Playwright specs against the app service
#
# The named node_modules volume is load-bearing on Windows: without it the host
# bind-mount shadows /app/node_modules and the Linux-built dependencies vanish.

services:
  app:
    build:
      context: .
      target: dev
    container_name: bey-app
    ports:
      - "3000:3000"
    environment:
      DOCKER: "1"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    healthcheck:
      # Plain node fetch — avoids depending on curl/wget being in the slim image.
      #
      # 127.0.0.1, NOT localhost. Inside the container `localhost` resolves to
      # ::1 before 127.0.0.1, while Vite's `host: true` binds 0.0.0.0 (IPv4
      # only) — so the IPv6 attempt hung until the probe timed out and the
      # container never became healthy. Naming the IPv4 loopback removes the
      # ambiguity instead of relying on Node's happy-eyeballs fallback.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      # 10s, not 5s: a cold start still pays for Vite's dependency pre-bundling
      # (three + phaser) on the first request over a Windows bind mount.
      timeout: 10s
      retries: 30
      start_period: 15s

  typecheck:
    build:
      context: .
      target: dev
    profiles: ["ci"]
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: npx tsc --noEmit

  # Production bundle. NODE_ENV=production is LOAD-BEARING, not decoration: the
  # `dev` stage sets NODE_ENV=development, and Vite derives `import.meta.env.DEV`
  # from NODE_ENV even during `vite build`. Building in the dev container without
  # this override therefore produces a bundle with DEV === true, which ships the
  # dev-only `window.__demo` API (a ~4 kB chunk plus a live handle on the
  # scene) into production. The `dist` target is also what makes
  # `grep __demo dist/assets/*.js` a meaningful check.
  dist:
    build:
      context: .
      target: dev
    profiles: ["ci"]
    environment:
      NODE_ENV: production
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: sh -c "npx tsc && npx vite build"

  # Pure-logic specs (geometry/physics maths). Deliberately has NO depends_on:
  # these tests touch no DOM, no WebGL and no dev server, so gating them on the
  # app container's healthcheck would make a maths regression undiagnosable
  # whenever the dev server is unwell — which is exactly the situation that
  # motivated splitting them out.
  unit:
    build:
      context: .
      target: test
    profiles: ["ci"]
    environment:
      DOCKER: "1"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: npx playwright test --project=unit

  test:
    build:
      context: .
      target: test
    profiles: ["ci"]
    depends_on:
      app:
        condition: service_healthy
    environment:
      # bey-app, NOT the `app` service name. Chromium HSTS-preloads the whole
      # `.app` gTLD, so it upgrades http://app:3000 to HTTPS and dies with
      # ERR_SSL_PROTOCOL_ERROR before the request leaves the browser. Resolves
      # via the app service's container_name. Must stay in sync with
      # `allowedHosts` in vite.config.ts, or Vite answers 403.
      PLAYWRIGHT_BASE_URL: http://bey-app:3000
      DOCKER: "1"
    # Chromium crashes on Docker's default 64 MB /dev/shm.
    shm_size: 1gb
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: npx playwright test

volumes:
  node_modules:
